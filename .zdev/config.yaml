version: 1
name: ${PROJECTDIR}
domain: ${PROJECTNAME}.${ZDEV_DOMAIN}

info: |
  ## ${PROJECTNAME}

  Symfony application.

  Run `zdev setup` to scaffold and install the project.

shared:
  router: true

services:
  app:
    image: php:8.4-cli-alpine
    command: >-
      sh -c "
      if [ ! -f .setup-complete ]; then
        echo 'Waiting for setup... Run: zdev setup';
        while [ ! -f .setup-complete ]; do sleep 2; done;
      fi;
      if ! command -v composer > /dev/null 2>&1; then
        wget -qO- https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer;
      fi;
      if ! command -v symfony > /dev/null 2>&1; then
        apk add --no-cache bash > /dev/null 2>&1;
        wget https://get.symfony.com/cli/installer -O - 2>/dev/null | bash > /dev/null 2>&1;
        cp \$HOME/.symfony5/bin/symfony /usr/local/bin/symfony;
      fi;
      composer install --no-interaction &&
      exec symfony server:start --no-tls --port=8000 --allow-all-ip"
    working_dir: /app
    volumes:
      - ${PROJECTPATH}:/app
    environment:
      APP_ENV: dev
      SYMFONY_TRUSTED_PROXIES: private_ranges
    routing:
      port: 8000

mutagen:
  ignore:
    - vendor
    - .zdev
    - .setup-complete
    - var
