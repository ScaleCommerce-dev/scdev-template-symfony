version: 1
name: ${PROJECTDIR}
domain: ${PROJECTNAME}.${ZDEV_DOMAIN}

info: |
  ## ${PROJECTNAME}

  Symfony application.

  `zdev create` scaffolds the project; `zdev start` installs deps and runs it.

shared:
  router: true

services:
  app:
    # PHP 8.4 + zpinit (supervise mode). On boot zpinit runs
    # .zdev/zpinit/entrypoint.d/ (composer install) then supervises the dev
    # server (.zdev/zpinit/services/10_app.toml). The project is scaffolded once
    # at `zdev create` time by .zdev/scaffold.sh. See .zdev/Dockerfile.
    dockerfile: .zdev/Dockerfile
    working_dir: /app
    volumes:
      - ${PROJECTPATH}:/app
    environment:
      APP_ENV: dev
      SYMFONY_TRUSTED_PROXIES: private_ranges
    routing:
      port: 8000

mutagen:
  ignore:
    - vendor
    - var
    - .zdev
